<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Compatible recursive split welfare curve</title>
  <desc id="desc">The parent remains beneficial while a compatible child welfare gap becomes increasingly negative as lambda rises.</desc>
  <rect width="1000" height="500" rx="24" fill="#eff6ff"/>
  <text x="55" y="62" fill="#172554" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Claim 6 · parent benefit does not have to propagate</text>
  <text x="55" y="98" fill="#1d4ed8" font-family="system-ui,sans-serif" font-size="17">Compatible log-space child split; parent reconstruction and global pool preserved</text>
  <g transform="translate(100 130)" font-family="system-ui,sans-serif">
    <line x1="0" y1="130" x2="790" y2="130" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="290" stroke="#64748b"/>
    <polyline points="20,119 150,120 280,131 410,166 550,230 700,275" fill="none" stroke="#2563eb" stroke-width="4"/>
    <g fill="#2563eb"><circle cx="20" cy="119" r="6"/><circle cx="150" cy="120" r="6"/><circle cx="280" cy="131" r="6"/><circle cx="410" cy="166" r="6"/><circle cx="550" cy="230" r="6"/><circle cx="700" cy="275" r="6"/></g>
    <line x1="0" y1="119" x2="790" y2="119" stroke="#10b981" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="430" y="107" fill="#047857" font-size="16">parent +0.128975</text>
    <text x="290" y="154" fill="#1e40af" font-size="16">first negative: λ=2</text>
    <text x="545" y="255" fill="#1e40af" font-size="16">−2.6201</text>
    <text x="20" y="330" fill="#172554" font-size="14">0</text><text x="150" y="330" fill="#172554" font-size="14">1</text><text x="280" y="330" fill="#172554" font-size="14">2</text><text x="410" y="330" fill="#172554" font-size="14">4</text><text x="550" y="330" fill="#172554" font-size="14">8</text><text x="700" y="330" fill="#172554" font-size="14">12</text>
    <text x="390" y="365" fill="#172554" font-size="16">λ (child tilt strength)</text>
  </g>
  <rect x="675" y="155" width="250" height="75" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="800" y="185" text-anchor="middle" fill="#1e3a8a" font-family="system-ui,sans-serif" font-size="15">max reconstruction error</text>
  <text x="800" y="213" text-anchor="middle" fill="#172554" font-family="system-ui,sans-serif" font-size="20" font-weight="700">1.11×10⁻¹⁶</text>
</svg>
